# --- Home gym rules block (GET /api/v1/home-gym/rules) ---
home_gym.rules.title = Home gym rules
home_gym.rules.toggle_label = Learn more
home_gym.rules.items.home_gym.title = What is a home gym?
home_gym.rules.items.home_gym.text = Pick one of the gyms included in your package as your home gym and go there {homeGymMonthlyLimit} times a month — instead of {standardMonthlyLimit}. You choose it after purchase.
home_gym.rules.items.monthly_limit.title = Monthly entries
home_gym.rules.items.monthly_limit.text = {homeGymMonthlyLimit} entries a month to your home gym, {homeGymDailyLimit} per day. The subscription month starts on your subscription start day.
home_gym.rules.items.daily_limit.title = Daily entry
home_gym.rules.items.daily_limit.text = You can enter your home gym {homeGymDailyLimit} time a day. The next entry opens after 00:00 Baku time.
home_gym.rules.items.other_gyms.title = Other gyms
home_gym.rules.items.other_gyms.text = After {otherGymsLockThreshold} visits to your home gym, entry to other gyms is locked. Your {homeGymMonthlyLimit} monthly home-gym entries stay available.
home_gym.rules.items.switch_to_standard.title = Switching to standard mode
home_gym.rules.items.switch_to_standard.text = If you have fewer than {otherGymsLockThreshold} home-gym visits this month and scan a QR code at another gym, the app asks for confirmation. If you confirm, your home gym selection is removed and the subscription switches to standard mode.
home_gym.rules.items.standard_limit.title = Standard mode
home_gym.rules.items.standard_limit.text = {standardMonthlyLimit} entries a month in standard mode. Visits you made at your home gym also count towards this limit.
home_gym.rules.items.time_slots.title = Time rules
home_gym.rules.items.time_slots.text = Gym time-slot rules apply according to your package. If your package does not allow entry at that time, the entry is rejected and does not use your limit.
home_gym.rules.items.freeze.title = Freezing
home_gym.rules.items.freeze.text = When you freeze your subscription, entry to your home gym is paused too. Freeze days extend your subscription month.
home_gym.rules.items.change.title = Changing your home gym
home_gym.rules.items.change.text = If you have not entered your home gym at all, you can change it. After a visit, the change moves to your next subscription month.
