# --- Home gym rules block (GET /api/v1/home-gym/rules) ---
home_gym.rules.title = Home gym rules
home_gym.rules.toggle_label = Show rules
home_gym.rules.items.home_gym.title = What is a home gym?
home_gym.rules.items.home_gym.text = Your home gym is your main training gym. You choose it once and keep it until the subscription ends, so there is no need to choose again every month.
home_gym.rules.items.monthly_limit.title = Monthly entry limit
home_gym.rules.items.monthly_limit.text = You can enter your home gym {homeGymMonthlyLimit} times per subscription month. The subscription month starts on your subscription start day and renews on the same day of the next month.
home_gym.rules.items.daily_limit.title = Daily entry limit
home_gym.rules.items.daily_limit.text = You can enter your home gym {homeGymDailyLimit} time per day. The next entry opens after 00:00 Baku time.
home_gym.rules.items.other_gyms.title = Entry to other gyms
home_gym.rules.items.other_gyms.text = If you have {otherGymsLockThreshold} or more visits to your home gym in the current subscription month, entry to other gyms is locked. Your {homeGymMonthlyLimit} monthly home-gym entries stay available.
home_gym.rules.items.switch_to_standard.title = Switching to standard mode
home_gym.rules.items.switch_to_standard.text = If you have fewer than {otherGymsLockThreshold} home-gym visits this month and you scan a QR code at another gym, the app asks for confirmation. If you confirm, your home gym selection is removed and the subscription switches to standard mode.
home_gym.rules.items.standard_limit.title = Limit in standard mode
home_gym.rules.items.standard_limit.text = In standard mode you have {standardMonthlyLimit} entries per month. Visits you made at your home gym also count towards this limit; once it is used up, the next entry is blocked.
home_gym.rules.items.time_slots.title = Time-slot rules
home_gym.rules.items.time_slots.text = Each gym applies its time-slot rules according to your package. If your package does not allow entry at that time, the entry is rejected and does not use your limit.
home_gym.rules.items.freeze.title = Freezing
home_gym.rules.items.freeze.text = When you freeze your subscription, entry to your home gym is paused too. Freeze days extend the end of your subscription month.
home_gym.rules.items.change.title = Changing your home gym
home_gym.rules.items.change.text = You can change your home gym only while you have no visits to any gym in the current subscription month. After a visit, the change moves to your next subscription month.
