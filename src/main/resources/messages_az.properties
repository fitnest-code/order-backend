# --- Əsas zal qaydaları bloku (GET /api/v1/home-gym/rules) ---
home_gym.rules.title = Əsas zal qaydaları
home_gym.rules.toggle_label = Daha çox
home_gym.rules.items.home_gym.title = Əsas zal nədir?
home_gym.rules.items.home_gym.text = Paketinə daxil olan zallardan birini əsas zal seç və ora ayda {homeGymMonthlyLimit} dəfə get — {standardMonthlyLimit} əvəzinə. Seçimi alışdan sonra edirsən.
home_gym.rules.items.monthly_limit.title = Aylıq giriş
home_gym.rules.items.monthly_limit.text = Əsas zala ayda {homeGymMonthlyLimit} giriş, gündə {homeGymDailyLimit} dəfə. Abunəlik ayı abunəliyin başladığı gündən hesablanır.
home_gym.rules.items.daily_limit.title = Gündəlik giriş
home_gym.rules.items.daily_limit.text = Əsas zala gündə {homeGymDailyLimit} dəfə girə bilərsən. Növbəti giriş Bakı vaxtı ilə 00:00-dan sonra açılır.
home_gym.rules.items.other_gyms.title = Digər zallar
home_gym.rules.items.other_gyms.text = Əsas zalda {otherGymsLockThreshold} girişdən sonra digər zallara giriş bağlanır. Əsas zalda aylıq {homeGymMonthlyLimit} giriş hüququn qalır.
home_gym.rules.items.switch_to_standard.title = Standart rejimə keçid
home_gym.rules.items.switch_to_standard.text = Əsas zalda bu ay {otherGymsLockThreshold}-dən az girişin olanda başqa zalda QR oxutsan, tətbiq təsdiq istəyir. Təsdiqləsən, əsas zal seçimin silinir və abunəlik standart rejimə keçir.
home_gym.rules.items.standard_limit.title = Standart rejim
home_gym.rules.items.standard_limit.text = Standart rejimdə ayda {standardMonthlyLimit} giriş. Əsas zalda etdiyin girişlər də bu limitə sayılır.
home_gym.rules.items.time_slots.title = Saat qaydaları
home_gym.rules.items.time_slots.text = Zalın saat aralığı qaydaları paketinə görə tətbiq olunur. Paketin həmin saatda icazə vermirsə, giriş rədd edilir və limitdən çıxılmır.
home_gym.rules.items.freeze.title = Dondurma
home_gym.rules.items.freeze.text = Abunəliyi donduranda əsas zala giriş də dayanır. Dondurma günləri abunəlik ayını uzadır.
home_gym.rules.items.change.title = Əsas zalı dəyişmək
home_gym.rules.items.change.text = Əsas zala heç giriş etməmisənsə, dəyişə bilərsən. Girişdən sonra dəyişiklik növbəti abunəlik ayına keçir.
