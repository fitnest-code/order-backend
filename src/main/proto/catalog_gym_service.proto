// Copied from catalog-backend for cross-service gRPC
syntax = "proto3";

package catalog;
option java_multiple_files = true;
option java_package = "az.fitnest.catalog.grpc";

message GymSupportsPlanRequest {
  int64 gym_id = 1;
  int64 plan_id = 2;
}

message GymSupportsPlanResponse {
  bool supported = 1;
}

message CountGymsByPackageRequest {
  int64 package_id = 1;
}

message CountGymsByPackageResponse {
  int64 gym_count = 1;
}

message CountGymsByPackagesRequest {
  repeated int64 package_ids = 1;
}

message CountGymsByPackagesResponse {
  map<int64, int64> gym_counts = 1;
}

message HasActiveReservationsRequest {
  int64 user_id = 1;
  string start_time = 2;
  string end_time = 3;
}

message HasActiveReservationsResponse {
  bool has_active_reservations = 1;
}

